[package]
name = "eavesdrop"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Read-only tail of cross-session messages between Claude Code agents"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"

[profile.release]
strip = true
